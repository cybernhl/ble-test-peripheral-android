buildscript {
    ext {
        //Ref : https://developer.android.com/build/releases/past-releases
        agp_gradle = libs.versions.agp.get()
        kotlin_version = libs.versions.kotlin.get()
    }
    repositories {
        gradlePluginPortal()
        maven { url "https://plugins.gradle.org/m2/" }
        google() {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots"
            name "SonatypeSnapshots"
            mavenContent {
                snapshotsOnly()
            }
        }
        maven { url = "https://maven.aliyun.com/repository/gradle-plugin/" }
        maven { url = "https://maven.aliyun.com/repository/spring-plugin/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://s3.amazonaws.com/repo.commonsware.com" }
        maven { url = "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
        maven { url = "https://api.xposed.info/" }
        maven { url = "https://jogamp.org/deployment/maven" }
        maven { url = "https://developer.huawei.com/repo/" }
        maven { url = "https://raw.githubusercontent.com/cybernhl/maven-repository/master/" }
        maven { url = "https://maven.aliyun.com/repository/jcenter" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        maven { url = "https://maven.aliyun.com/repository/spring/" }
        maven { url = "https://maven.aliyun.com/repository/google/" }
        maven { url = "https://maven.aliyun.com/repository/grails-core/" }
        maven { url = "https://maven.aliyun.com/repository/apache-snapshots/" }
        maven { url = "https://packages.jetbrains.team/maven/p/skija/maven" }
    }
    dependencies {
//        classpath "com.android.tools.build:gradle:$agp_gradle"
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false

    alias(libs.plugins.android.kotlin.multiplatform.library) apply false

    alias(libs.plugins.jetbrains.compose) apply false
    alias(libs.plugins.compose.compiler) apply false

    alias(libs.plugins.kotlin.serialization) apply false
}

allprojects {

}

task clean(type: Delete) {
    delete rootProject.buildDir
}
